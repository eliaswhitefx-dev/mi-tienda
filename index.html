<script>
tailwind.config={darkMode:'class',theme:{extend:{colors:{
 indigo:{50:'#fbf1f4',100:'#f6e0e7',200:'#edc3d1',300:'#e09bb2',400:'#cf6a8b',500:'#b4416a',600:'#8a2f4f',700:'#6d2340',800:'#561c33',900:'#3f1426'},

const applyTheme=()=>{const t=document.documentElement.dataset.theme;const d=t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.classList.toggle('dark',d)};
applyTheme();matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);
new MutationObserver(applyTheme).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const {useState,useEffect,useMemo}=React;
const html=htm.bind(React.createElement);
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const uid=()=>Math.random().toString(36).slice(2,9);
const n2=x=>+x||0;
const USD=x=>'$'+n2(x).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
const BS=x=>'Bs '+n2(x).toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
const sum=(a,k)=>a.reduce((t,x)=>t+n2(x[k]),0);
const PAGOS=['Efectivo $','Efectivo Bs','Pago Móvil Bs','Crédito'];
const CATS=['Alquiler','Comida','Casa','Gasto Personal','Transporte','Gustos','Otros'];
const DEF_TIPOS=['Ropa','Accesorios'],DEF_PUBS=['Dama','Caballero','Niños','Unisex'];
let TIPOS=DEF_TIPOS,PUBS=DEF_PUBS;
const KEY='erp-ropa-v2';
let SUBS=[];
const SUBS0=['Pantalones','Camisas','Blusas','Vestidos','Faldas','Shorts','Franelas','Chaquetas','Conjuntos','Pijamas','Ropa interior','Zapatos','Bolsos','Bisutería','Gorras','Cinturones'];
const SUBKEYS=[[/blus/,'Blusas'],[/pantal|jean|vaquero|palazo|jogger|\bcargo/,'Pantalones'],[/short|bermuda/,'Shorts'],[/camisa|camisero/,'Camisas'],[/franela|camiseta|playera|t-?shirt|\btop\b|crop/,'Franelas'],[/vestido|enterizo|jumper/,'Vestidos'],[/falda|pollera/,'Faldas'],[/chaquet|cazadora|blazer|chamarra/,'Chaquetas'],[/abrigo|gabardina/,'Abrigos'],[/sueter|sweater|pullover|cardigan|buzo|hoodie/,'Suéteres'],[/conjunto/,'Conjuntos'],[/pijama|camison/,'Pijamas'],[/legging|licra/,'Leggings'],[/interior|panty|pantaleta|brasier|boxer|lenceria|medias|calcet/,'Ropa interior'],[/zapato|sandalia|\bbota|tenis|zapatilla|chancla|mocasin/,'Zapatos'],[/bolso|cartera|morral|mochila|monedero/,'Bolsos'],[/gorra|sombrero|gorro/,'Gorras'],[/cinturon|correa/,'Cinturones'],[/collar|arete|pulsera|anillo|cadena|reloj|lentes|bisuter/,'Bisutería']];
const autoSub=nombre=>{const n=normH(nombre);if(!n)return '';
  for(const sb of SUBS){const st=normH(sb).replace(/(es|s)$/,'');if(st.length>=4&&new RegExp('(^|[^a-z])'+st).test(n))return sb}
  for(const [re,sb] of SUBKEYS)if(re.test(n))return SUBS.find(y=>normH(y)===normH(sb))||sb;
  return ''};
const resSub=(v,nombre)=>{const x=String(v||'').trim();return x==='-'?'':x?normSub(x):autoSub(nombre)};
const normSub=x=>{const v=String(x||'').trim().replace(/\s+/g,' ');if(!v||v==='-')return '';const h=normH(v),f=SUBS.find(y=>normH(y)===h);return f||v.charAt(0).toUpperCase()+v.slice(1)};
const SubField=({v,onC,nombre})=>html`<${F} l="Tipo de prenda"><input list="subs-l" class=${inp} value=${v} onChange=${onC} placeholder=${autoSub(nombre)||'Automático según el nombre'}/>${!String(v||'').trim()&&autoSub(nombre)&&html`<span class="block text-[11px] text-slate-500 mt-1">Se agrupará como <b>${autoSub(nombre)}</b>. Escribe "-" para dejarla sin tipo.</span>`}<datalist id="subs-l">${SUBS.map(x=>html`<option key=${x} value=${x}/>`)}</datalist><//>`;
const labP=(n,c,tl)=>n+(c?' '+c:'')+(tl?' '+tl:'');
const lab=p=>labP(p.nombre,p.color,p.talla);
const letraV=i=>{let r='';i++;while(i>0){const m=(i-1)%26;r=String.fromCharCode(65+m)+r;i=Math.floor((i-1)/26)}return r};
const codDe=p=>p&&p.cod?p.cod+(p.vc?'-'+p.vc:''):'';
function asegCods(x){
  const P=x.productos;if(!P.some(p=>!p.cod||(!p.vc&&p.gid&&P.filter(y=>y.gid===p.gid).length>1)))return;
  let mx=0;P.forEach(p=>{const n=parseInt(p.cod,10);if(n>mx)mx=n});
  const G={};[...P].reverse().forEach(p=>{const k=p.gid||p.id;(G[k]=G[k]||[]).push(p)});
  Object.values(G).forEach(g=>{let c=(g.find(p=>p.cod)||{}).cod;if(!c){mx++;c=String(mx).padStart(3,'0')}
    g.forEach(p=>{if(!p.cod)p.cod=c});
    if(g.length>1){const used=new Set(g.map(p=>p.vc).filter(Boolean));let i=0;g.forEach(p=>{if(p.vc)return;while(used.has(letraV(i)))i++;p.vc=letraV(i);used.add(p.vc)})}})}

const VEND=()=>{try{return localStorage.getItem('lirios-vend')||''}catch(e){return ''}};
const upT=(c,f,v)=>{c.tasas=c.tasas||[];const x=c.tasas.find(y=>y.fecha===f);if(x)x.tasa=v;else c.tasas.push({fecha:f,tasa:v})};
const tasaDe=(s,f)=>{const h=[...(s.tasas||[])].sort((a,b)=>a.fecha<b.fecha?-1:1);const ex=h.find(x=>x.fecha===f);if(ex)return{t:ex.tasa,ex:true,f};let p=null;h.forEach(x=>{if(x.fecha<=f)p=x});if(p)return{t:p.tasa,ex:false,f:p.fecha};return h.length?{t:h[0].tasa,ex:false,f:h[0].fecha}:{t:s.tasa,ex:false,f:''}};

const COMPRA_PAGOS=['Efectivo $','Efectivo Bs','Pago Móvil Bs','Crédito'];
const compraLab=p=>p==='Crédito'?'Crédito (por pagar)':p;
const ofActiva=(p,fecha)=>p&&p.of&&n2(p.of.precio)>0&&n2(p.of.precio)<n2(p.precio)&&(!p.of.hasta||p.of.hasta>=(fecha||today()))?p.of:null;
const OFPG=['Efectivo $','Efectivo Bs','Pago Móvil Bs'];
const ofPagos=o=>(o&&o.pg&&o.pg.length)?o.pg:['Efectivo $'];
const descEfU=(s,p,pago,fecha)=>{const o=ofActiva(p,fecha);return o&&ofPagos(o).includes(pago)?n2(p.precio)-n2(o.precio):0};
const ventaCalc=(s,p,pago,cant,montoUsd,fecha)=>{const pr=p?p.precio:0,d=descEfU(s,p,pago,fecha),lista=cant*pr,aplic=cant*(pr-d),usd=montoUsd==null?aplic:montoUsd;return{lista,aplic,usd,dEf:lista-aplic,reb:Math.max(0,aplic-usd)}};

function seed(){
  return{v:2,tasa:813,tasas:[{fecha:today(),tasa:813}],cfg:{descEf:3,tipoEf:'$',tienda:'Mi tienda',eslogan:'',bienvenida:'',destacado:'',destRef:''},capital:0,productos:[],ventas:[],abonos:[],movs:[],banco:[],egresos:[],apartados:[],invs:[],clientes:{},del:{},res:{},gen:0};
}
const norm=d=>{
  if(!d.tasas)d.tasas=[{fecha:today(),tasa:d.tasa}];
  if(!d.banco)d.banco=[];
  if(!d.cfg)d.cfg={descEf:3,tipoEf:'$'};
  if(d.cfg.tienda===undefined)d.cfg.tienda='Lirios Store';
  if(d.cfg.eslogan===undefined){const L=d.cfg.tienda==='Lirios Store';d.cfg.eslogan=L?'Vestidos con la gracia y la belleza del campo':'';d.cfg.bienvenida='';d.cfg.destacado=L?'Considerad los lirios del campo, cómo crecen: no trabajan ni hilan; pero os digo, que ni aun Salomón con toda su gloria se vistió así como uno de ellos.':'';d.cfg.destRef=L?'Mateo 6:28-29':''}
  if(!d.cfg.asesores)d.cfg.asesores=d.cfg.wa?[{n:'Ventas',t:String(d.cfg.wa)}]:[];
  ['movs','egresos','abonos','ventas','productos','apartados','invs','perdidas'].forEach(k=>{if(!d[k])d[k]=[]});
  if(!d.clientes)d.clientes={};
  if(!d.del||typeof d.del!=='object')d.del={};
  if(!d.res||typeof d.res!=='object')d.res={};
  if(!d.gen)d.gen=0;
  {const lim=Date.now()-120*864e5;Object.keys(d.del).forEach(k=>{if(d.del[k]<lim){delete d.del[k];delete d.res[k]}})}
  if(!d.v||d.v<2){
    d.banco.forEach(m=>{if(m.conf===undefined)m.conf=!!m.link});
    d.movs.forEach(m=>{if(m.tipo==='Entrada'&&!m.pago){m.pago='Efectivo $';m.usd=n2(m.cant)*n2(m.costo)}});
    d.egresos=d.egresos.filter(e=>!(e.cat==='Pago Proveedores'&&String(e.desc||'').startsWith('Mercanc')));
    d.productos.forEach(p=>{
      const ent=sum(d.movs.filter(m=>m.pid===p.id&&m.tipo==='Entrada'),'cant'),sal=sum(d.movs.filter(m=>m.pid===p.id&&m.tipo==='Salida'),'cant'),ven=sum(d.ventas.filter(x=>x.pid===p.id),'cant');
      const ini=p.stock+ven+sal-ent;
      if(ini>0.0001)d.movs.push({id:uid(),fecha:today(),pid:p.id,nombre:lab(p),tipo:'Entrada',cant:ini,costo:p.costo,usd:ini*p.costo,pago:'Efectivo $',nota:'Inventario inicial',ini:true})});
    d.v=2}
  return d};
const load=()=>{try{const x=localStorage.getItem(KEY);if(x)return norm(JSON.parse(x))}catch(e){}return norm(seed())};

function calc(s){
  const c={efUsd:0,efBs:0,efBsBs:0,pm:0,pmBs:0,pmPend:0,pmPendBs:0,pmPendN:0,cred:0,vendido:0,costoVend:0,reb:0,dEf:0,uds:0};
  s.ventas.forEach(v=>{c.vendido+=v.usd;c.costoVend+=v.cant*n2(v.costo);c.reb+=n2(v.reb);c.dEf+=n2(v.dEf);c.uds+=v.cant;
    if(v.pago==='Efectivo $')c.efUsd+=v.usd;
    else if(v.pago==='Efectivo Bs'){c.efBs+=v.usd;c.efBsBs+=v.bs}
    else if(v.pago==='Pago Móvil Bs'){if(v.estatus==='Confirmado'){c.pm+=v.usd;c.pmBs+=v.bs}else{c.pmPend+=v.usd;c.pmPendBs+=v.bs;c.pmPendN++}}
    else c.cred+=v.usd});
  const dA=sum(s.abonos,'desc');c.dEf+=dA;c.vendido-=dA;c.cred-=dA;
  let abOk=0,abPend=0;
  s.abonos.forEach(a=>{if(a.metodo==='Pago Móvil Bs'&&a.estatus!=='Confirmado')abPend+=a.usd;else abOk+=a.usd});
  const I={efUsd:0,efBs:0,efBsBs:0,pm:0,pmBs:0,credPag:0,credPend:0,total:0};
  [...s.movs.filter(m=>m.tipo==='Entrada'),...(s.invs||[])].forEach(m=>{
    const u=n2(m.usd!=null?m.usd:n2(m.cant)*n2(m.costo)),p=m.pago||'Efectivo $';I.total+=u;
    const bs=n2(m.bs!=null?m.bs:u*tasaDe(s,m.fecha).t);
    if(p==='Efectivo $')I.efUsd+=u;
    else if(p==='Efectivo Bs'){I.efBs+=u;I.efBsBs+=bs}
    else if(p==='Pago Móvil Bs'){I.pm+=u;I.pmBs+=bs}
    else if(m.pagada)I.credPag+=u;else I.credPend+=u});
  const merc={uds:sum(s.productos,'stock'),costo:s.productos.reduce((t,p)=>t+p.stock*p.costo,0),venta:s.productos.reduce((t,p)=>t+p.stock*p.precio,0)};
  return{c,abOk,abPend,I,merc,gastos:sum(s.egresos,'usd'),cobrado:c.efUsd+c.efBs+c.pm+abOk,cxc:sum(Object.values(s.clientes).map(v=>({v})),'v')};
}

const inp='w-full rounded-xl border border-slate-200 dark:border-slate-600 bg-white dark:bg-slate-900 px-3 py-2.5 text-sm outline-none transition-shadow focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 dark:focus:ring-indigo-900';
const card='rounded-2xl bg-white dark:bg-slate-800 border border-slate-200/80 dark:border-slate-700 p-4 shadow-[0_1px_2px_rgba(31,27,28,.04)]';
const btn='rounded-xl bg-indigo-600 hover:bg-indigo-700 active:scale-[.98] text-white text-sm font-medium px-4 py-2.5 transition';
const btn2='rounded-xl border border-slate-200 dark:border-slate-600 text-sm px-3 py-1.5 hover:bg-slate-100 dark:hover:bg-slate-700 active:scale-[.98] transition';
const F=({l,children})=>html`<label class="block text-xs font-medium text-slate-600 dark:text-slate-300">${l}<div class="mt-1">${children}</div></label>`;
const Badge=({t})=>{const c={'Por Confirmar':'bg-amber-100 text-amber-800','Confirmado':'bg-emerald-100 text-emerald-800','Crédito':'bg-sky-100 text-sky-800','Pagado':'bg-slate-100 text-slate-700'}[t];return html`<span class=${'px-2 py-0.5 rounded-full text-xs '+c}>${t}</span>`};
const Stat=({l,v,sub,c=''})=>html`<div class=${card}><div class="text-xs text-slate-500 dark:text-slate-400">${l}</div><div class=${'text-lg font-semibold '+c}>${v}</div>${sub&&html`<div class="text-xs text-slate-500 dark:text-slate-400">${sub}</div>`}</div>`;
const Msg=({t,ok})=>t?html`<p class=${'text-sm '+(ok?'text-emerald-600':'text-rose-600')}>${t}</p>`:null;
const Del=({on,ask,set,id})=>ask===id?html`<span class="whitespace-nowrap"><button class="text-xs text-rose-600 font-semibold px-1" onClick=${on}>Borrar</button><button class="text-xs px-1" onClick=${()=>set(null)}>✕</button></span>`:html`<button title="Borrar" class="px-1" onClick=${()=>set(id)}>🗑️</button>`;

function Ventas({s,up}){
  const disp=s.productos.filter(p=>p.stock>0);
  const [f,setF]=useState({fecha:today(),pid:'',q:'',cant:'1',mUsd:'',mBs:'',ult:'usd',pago:'Efectivo $',cliente:'',ref:'',por:VEND()}),[zoom,setZoom]=useState(null);
  const [err,setErr]=useState('');
  const mailN=String(CMAIL||'').split('@')[0],[otro,setOtro]=useState(false);
  const vendedores=[...new Set([...((s.cfg&&s.cfg.asesores)||[]).map(a=>a.n),...s.ventas.slice(0,300).map(v=>v.por),VEND(),mailN].map(x=>String(x||'').trim()).filter(Boolean))].slice(0,8);
  const tz=tasaDe(s,f.fecha).t;
  const p=s.productos.find(x=>x.id===f.pid&&x.stock>0)||null;
  const words=normH(f.q).split(/\s+/).filter(Boolean);
  const gsz=x=>x.gid?disp.filter(y=>y.gid===x.gid):[x];
  const matches=(()=>{const sg=new Set();return disp.filter(x=>{const t=normH(lab(x)+' '+codDe(x)+' '+x.cat+' '+(x.sub||''));return words.every(w=>t.includes(w))}).filter(x=>{if(!x.gid)return true;if(sg.has(x.gid))return false;sg.add(x.gid);return true})})();
  const cfg=s.cfg||{descEf:3,tipoEf:'$'};
  const set=k=>e=>setF({...f,[k]:e.target.value});
  const setU=e=>{const v=e.target.value;setF({...f,ult:'usd',mUsd:v,mBs:v===''?'':(n2(v)*tz).toFixed(2)})};
  const setB=e=>{const v=e.target.value;setF({...f,ult:'bs',mBs:v,mUsd:v===''?'':(n2(v)/tz).toFixed(2)})};
  const pick=x=>setF({...f,pid:x.id,q:'',mUsd:'',mBs:''});
  const cant=Math.floor(n2(f.cant));
  const mont=f.mUsd===''?null:(f.ult==='bs'?n2(f.mBs)/tz:n2(f.mUsd));
  const vc=ventaCalc(s,p,f.pago,cant,mont,f.fecha),usd=vc.usd,dU=descEfU(s,p,f.pago,f.fecha);
  const pm=f.pago==='Pago Móvil Bs';
  const setCfg=(k,v)=>up(c=>{c.cfg=c.cfg||{descEf:3,tipoEf:'$'};c.cfg[k]=v});
  const add=()=>{
    if(!p)return setErr('Busca y elige un producto de la lista.');
    if(cant<=0)return setErr('Indica la cantidad.');
    if(cant>p.stock)return setErr('Solo quedan '+p.stock+' unidades en inventario.');
    if(usd<=0)return setErr('El monto debe ser mayor a cero.');
    if(pm&&!f.ref.trim())return setErr('El Pago Móvil exige número de referencia.');
    if(f.pago==='Crédito'&&!f.cliente.trim())return setErr('El crédito requiere el nombre del cliente.');
    if(!f.por.trim())return setErr('Elige quién hizo la venta (así queda el responsable registrado).');
    setErr('');
    up(x=>{const z=x.productos.find(y=>y.id===p.id);z.stock-=cant;const cli=f.cliente.trim()||'Mostrador';
      x.ventas.unshift({id:uid(),fecha:f.fecha,pid:p.id,nombre:lab(p),cat:p.cat,cant,usd,bs:usd*tz,tasa:tz,costo:z.costo,lista:vc.lista,aplic:vc.aplic,dEf:vc.dEf,reb:vc.reb,pago:f.pago,cliente:cli,ref:pm?f.ref.trim():'',estatus:pm?'Por Confirmar':f.pago==='Crédito'?'Crédito':'Pagado',por:f.por.trim()});
      if(f.pago==='Crédito')x.clientes[cli]=n2(x.clientes[cli])+usd});
    try{localStorage.setItem('lirios-vend',f.por.trim())}catch(e){}
    setF({...f,cant:'1',mUsd:'',mBs:'',ref:'',cliente:''});
  };
  const dia=s.ventas.filter(v=>v.fecha===f.fecha);
  return html`<div class="space-y-4">
    <div class=${card}><h2 class="font-semibold mb-3">Nueva venta</h2>
      <input class=${inp} placeholder="🔍 Buscar producto (nombre, talla, color…)" value=${f.q} onChange=${set('q')} onKeyDown=${e=>{if(e.key==='Enter'&&matches[0]){e.preventDefault();pick(matches[0])}}}/>
      ${f.q.trim()&&html`<div>
      <div class="mt-2 max-h-52 overflow-y-auto rounded-lg border border-slate-200 dark:border-slate-700 divide-y divide-slate-100 dark:divide-slate-700">

    up(x=>{plan.forEach(r=>{
      x.productos.unshift({id:r.id,pub:d.pub,sub,vis:true,foto:!!ft,...(gid?{gid}:{}),nombre:d.nombre.trim(),cat:d.cat,talla:r.talla,color:r.color,stock:r.st,costo:cs,precio:n2(d.precio)});

function Prod({p,up,reb,ms,ap,nv,sib=[],ed}){
  const mkD=()=>({sv:Object.fromEntries(sib.map(y=>[y.id,{color:y.color||'',talla:y.talla||'',stock:y.stock}])),sub:p.sub||'',ofOn:!!(p.of&&p.of.precio),ofPrecio:(p.of&&p.of.precio)||'',ofCond:(p.of&&p.of.cond)||'',ofHasta:(p.of&&p.of.hasta)||'',ofPg:ofPagos(p.of),pub:p.pub||'Unisex',vis:p.vis!==false,nombre:p.nombre,cat:p.cat,talla:p.talla||'',color:p.color||'',stock:p.stock,costo:p.costo,precio:p.precio,fecha:(ms&&ms[0]&&ms[0].fecha)||today(),pago:(ms&&ms[0]&&ms[0].pago)||'Efectivo $'});

function MovRow({x,up}){

  await db.runTransaction(async tx=>{
    const sn=await tx.get(ref),bs=await tx.get(b1),sj=sn.exists?await unpackErp(sn.data()):null;
    if(sn.exists&&(sn.data().av||0)>APPV)throw Object.assign(new Error('newer'),{code:'newer-app'});
    let out=localJ;
    if(sj!==null&&esVacio(localJ)&&!esVacio(sj))out=sj;
    else if(sj!==null&&sj!==baseJ&&sj!==localJ){try{out=JSON.stringify(merge3(baseJ?JSON.parse(baseJ):null,JSON.parse(localJ),JSON.parse(sj)))}catch(e){out=localJ}}

      try{const bt=bs.exists?(bs.data().updated||0):0;
        if(sj!==null&&Date.now()-bt>6*36e5){let n=0,vt=0;try{const q=JSON.parse(sj);n=(q.productos||[]).length;vt=(q.ventas||[]).length}catch(e){}

const OFFLINE_CACHE='tienda-v7';

async function chequeoOffline(reparar){
  if(!('serviceWorker' in navigator)||!window.caches)return{ok:false,msg:'Este navegador no puede guardar la app para usarla sin internet.'};
  const reg=await navigator.serviceWorker.getRegistration();
  if(!reg)return{ok:false,msg:'Aún no se activó el guardado sin internet. Cierra y abre la app con internet.'};
  const shell=['./','index.html','config.js','manifest.webmanifest'].map(u=>new URL(u,location.href).href);
  const falta=async()=>{const m=[];for(const u of [...shell,...OFFLINE_NEED])if(!(await caches.match(u,{ignoreSearch:true})))m.push(u);return m};
  let m=await falta();

    const c=await caches.open(OFFLINE_CACHE);
    await Promise.all(m.map(u=>(u.startsWith(location.origin)?fetch(u).then(r=>{if(r.ok)return c.put(u,r)}):fetch(new Request(u,{mode:'no-cors'})).then(r=>c.put(u,r))).catch(()=>{})));

  return{ok:true,ctl:!!navigator.serviceWorker.controller,msg:'Lista para usar sin internet'}}

/* ================= Visitas al catálogo ================= */
const diaVE=(off=0)=>new Date(Date.now()-4*36e5-off*864e5).toISOString().slice(0,10);
function Visitas(){
  const [m,setM]=useState({}),[er,setEr]=useState(false);
  useEffect(()=>{if(!fbDb||!CUID)return;return fbDb.collection('catalogos/'+CUID+'/visitas').onSnapshot(sn=>{const x={};sn.forEach(d=>{x[d.id]=n2(d.data().n)});setM(x);setEr(false)},()=>setEr(true))},[CUID]);
  const dias=[6,5,4,3,2,1,0].map(o=>{const d=diaVE(o);return{d,n:m[d]||0,l:new Date(d+'T12:00:00').toLocaleDateString('es-VE',{weekday:'short'})}});
  const mx=Math.max(1,...dias.map(x=>x.n)),tot=dias.reduce((t,x)=>t+x.n,0);
  return html`<div class=${card}><h2 class="font-semibold">👁️ Visitas al catálogo</h2>

    <div class="flex items-end gap-1 h-16 mt-3">${dias.map(x=>html`<div key=${x.d} class="flex-1 flex flex-col items-center justify-end h-full"><div class="w-full rounded-t bg-indigo-400" style=${{height:Math.max(3,Math.round(x.n/mx*100))+'%'}} title=${x.d+': '+x.n}></div></div>`)}</div>
    <div class="flex gap-1">${dias.map(x=>html`<div key=${x.d} class="flex-1 text-center text-[10px] text-slate-500">${x.l}</div>`)}</div>

const numX=v=>{const x=parseFloat(String(v==null?'':v).replace(/[^0-9.,-]/g,'').replace(',','.'));return isFinite(x)?x:0};
async function plantillaExcel(){

  const w2=XLSX.utils.aoa_to_sheet(ins);w2['!cols']=[{wch:18},{wch:12},{wch:90}];XLSX.utils.book_append_sheet(wb,w2,'Instrucciones');

async function urlADataUrl(u){
  try{const r=await fetch(u),b=await r.blob();if(!b.type.startsWith('image/'))throw 0;return await compress(b)}catch(e){return u}}
function CargaMasiva({s,up,onClose}){
  const [rows,setRows]=useState(null),[imgs,setImgs]=useState({}),[msg,setMsg]=useState(''),[bz,setBz]=useState(false),[fecha,setFecha]=useState(today()),[pago,setPago]=useState('Efectivo $');
  const leer=async f=>{setMsg('Leyendo…');setRows(null);
    try{await loadX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});const ws=wb.Sheets['Productos']||wb.Sheets[wb.SheetNames[0]];
      const A=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});if(A.length<2)throw new Error('El archivo no tiene filas.');
      const hd=A[0].map(h=>ALIAS[normH(h).replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'')]||'');
      if(!hd.includes('nombre')||!hd.includes('precio')){setMsg('No encuentro las columnas "nombre" y "precio". Usa la plantilla.');return}
      const out=[];A.slice(1).forEach((r,i)=>{if(!r.some(x=>String(x).trim()!==''))return;const o={};hd.forEach((k,j)=>{if(k)o[k]=r[j]});
        const nombre=String(o.nombre||'').trim();if(!nombre||/^\(ejemplo/i.test(nombre))return;
        const e=[],c=normH(o.cat||''),cat=c===''?(TIPOS[0]||'Ropa'):(TIPOS.find(x=>normH(x)===c)||TIPOS.find(x=>c.length>=4&&normH(x).startsWith(c.slice(0,4)))||'');
        if(!cat)e.push('categoría debe ser: '+TIPOS.join(', '));
        const pb=normH(o.pub||''),pub=PUBS.find(x=>normH(x)===pb)||(pb.startsWith('nin')&&PUBS.find(x=>normH(x).startsWith('nin')))||(PUBS.includes('Unisex')?'Unisex':PUBS[0]);
        const precio=numX(o.precio),pe=numX(o.precio_efectivo),stock=Math.max(0,Math.floor(numX(o.stock)));
        if(precio<=0)e.push('precio inválido');
        const av=[];if(pe>0&&pe>=precio&&precio>0)av.push('precio_efectivo no es menor: se ignora');
        out.push({fila:i+2,id:uid(),nombre,cat,pub,sub:resSub(o.sub,nombre),talla:String(o.talla||'').trim(),color:String(o.color||'').trim(),stock,costo:numX(o.costo),precio,pe:pe>0&&pe<precio?pe:0,foto:String(o.foto||'').trim(),e,av})});
      setRows(out);setMsg(out.length?'':'No encontré prendas en el archivo.')}catch(x){setMsg('No se pudo leer el archivo: '+(x&&x.message||x))}};
  const addImgs=fl=>{const m={...imgs};[...fl].forEach(f=>{const n=f.name.toLowerCase();m[n]=f;m[n.replace(/\.[^.]+$/,'')]=f});setImgs(m)};
  const buscarImg=r=>{if(!r.foto)return null;const n=r.foto.toLowerCase();return imgs[n]||imgs[n.replace(/\.[^.]+$/,'')]||null};

      if(r.stock>0&&r.costo>0){const usd=r.stock*r.costo;x.movs.unshift({id:uid(),fecha,pid:r.id,nombre:labP(r.nombre,r.color,r.talla),tipo:'Entrada',cant:r.stock,costo:r.costo,usd,pago,bs:bsM?usd*tasaDe(x,fecha).t:null,pagada:false,nota:'Carga masiva'})}})});

  return html`<div class=${card}><div class="flex justify-between"><h2 class="font-semibold">Carga masiva por Excel o CSV</h2><button class="px-1" onClick=${onClose}>✕</button></div>
    <ol class="text-xs text-slate-500 mt-1 list-decimal pl-4 space-y-0.5"><li>Descarga la plantilla y llénala (una prenda por fila).</li><li>Sube el archivo aquí. Si usas fotos, sube también las imágenes (el nombre de cada archivo va en la columna <b>foto</b>).</li><li>Revisa la vista previa y pulsa Importar.</li></ol>

      <label class=${btn2+' cursor-pointer inline-block'}>🖼️ Subir fotos${Object.keys(imgs).length?' ('+new Set(Object.values(imgs)).size+')':''}<input type="file" accept="image/*" multiple class="hidden" onChange=${e=>{addImgs(e.target.files);e.target.value=''}}/></label></div>
    ${rows&&html`<div class="mt-3"><div class="grid grid-cols-2 gap-3 mb-2"><${F} l="Fecha de la compra"><input type="date" class=${inp} value=${fecha} onChange=${e=>setFecha(e.target.value)}/><//><${F} l="Cómo se pagó la mercancía"><select class=${inp} value=${pago} onChange=${e=>setPago(e.target.value)}>${COMPRA_PAGOS.map(x=>html`<option key=${x} value=${x}>${compraLab(x)}</option>`)}</select><//></div>

      <div class="overflow-x-auto max-h-64 overflow-y-auto mt-1"><table class="w-full text-xs"><thead><tr class="text-left text-slate-500"><th>Fila</th><th>Nombre</th><th>Cat.</th><th>Talla</th><th>Stock</th><th>Precio</th><th>Efectivo</th><th>Foto</th><th></th></tr></thead><tbody>
        ${rows.slice(0,200).map(r=>html`<tr key=${r.id} class=${'border-t border-slate-100 dark:border-slate-700 '+(r.e.length?'text-rose-600':'')}><td>${r.fila}</td><td>${r.nombre}</td><td>${r.cat||'?'}</td><td>${r.talla}</td><td>${r.stock}</td><td>${USD(r.precio)}</td><td>${r.pe?USD(r.pe):''}</td><td>${r.foto?(buscarImg(r)?'✓':/^https?:/i.test(r.foto)?'🔗':'✗'):''}</td><td>${r.e.concat(r.av).join('; ')}</td></tr>`)}</tbody></table></div>

    <${Msg} t=${msg} ok=${msg.startsWith('✓')}/></div>`;
}
